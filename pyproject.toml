[project]
name = "movie-recsys"
version = "0.1.0"
description = "Movie recommendation system on MovieLens ml-32m"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are the documented, idiomatic API.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
